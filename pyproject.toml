[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superinstance-math"
version = "0.1.0"
description = "Pure-Python math libraries for ML engineers — information geometry, optimal transport, persistent homology, spectral methods, and symmetry groups"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["math", "machine-learning", "information-geometry", "optimal-transport", "topological-data-analysis", "spectral", "group-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/SuperInstance/superinstance-math"

[tool.hatch.build.targets.wheel]
packages = ["src/superinstance_math"]

[tool.pytest.ini_options]
testpaths = ["tests"]
